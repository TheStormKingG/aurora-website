# AI review on every pull request — the merge gate for critical findings.
#
# Deliberately `pull_request`, NOT `pull_request_target`. The latter runs in
# the base repo's context with access to secrets while checking out the PR's
# code, which hands an attacker with a fork the ANTHROPIC_API_KEY. The cost of
# this choice is that PRs from forks get no review (secrets are withheld);
# that is the right trade for a repo whose PRs all come from its owner. If
# outside contributors ever arrive, review their PRs by pushing the branch to
# this repo rather than by switching to pull_request_target.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# A rapid second push should supersede the first review, not pay for both.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script diffs origin/<base>...HEAD, so the base branch has to
          # be in the clone. The default shallow fetch does not include it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Review the diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # gh pr comment authenticates with this.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ai-review.mjs
